<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Schematic comparison of XCH and reference peak spacing</title>
  <desc id="desc">Two vertically offset schematic curves show a closer pair of peaks for XCH in warm ochre and a farther pair for Reference in dark green. Double-headed arrows mark each pair's spacing. The curves and arrows are illustrative only and are not quantitative data.</desc>
  <defs>
    <marker id="arrow-ochre" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a97945"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#315d50"/></marker>
  </defs>
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="598" y="48" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="1" fill="#7c8781">SCHEMATIC</text>
  <text x="34" y="127" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#a97945">XCH</text>
  <path d="M 108 145 C 170 145, 200 143, 230 135 C 242 130, 245 94, 260 88 C 274 83, 282 112, 290 133 C 300 151, 320 150, 333 130 C 341 114, 344 90, 355 87 C 371 83, 380 119, 393 139 C 408 148, 430 145, 445 145" fill="none" stroke="#a97945" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="260" y1="169" x2="355" y2="169" stroke="#a97945" stroke-width="2.5" marker-start="url(#arrow-ochre)" marker-end="url(#arrow-ochre)"/>
  <text x="34" y="247" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#315d50">Reference</text>
  <path d="M 175 250 C 207 250, 225 248, 242 242 C 251 239, 252 215, 260 208 C 271 199, 281 221, 288 240 C 295 256, 308 258, 321 250 C 360 250, 390 249, 420 241 C 445 236, 457 215, 480 207 C 500 199, 512 230, 522 243 C 532 253, 550 250, 570 250" fill="none" stroke="#315d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="260" y1="282" x2="480" y2="282" stroke="#315d50" stroke-width="2.5" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <line x1="82" y1="296" x2="594" y2="296" stroke="#7c8781" stroke-width="2.5"/>
  <path d="M 594 296 l -11 -6 v 12 z" fill="#7c8781"/>
  <text x="338" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#303a35">Energy</text>
</svg>


