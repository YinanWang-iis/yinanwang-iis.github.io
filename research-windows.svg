<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Energy windows for schematic XANES comparison</title>
  <desc id="desc">A smooth illustrative XANES-like curve crosses three softly shaded energy windows labeled A, B, and C. The curve and window boundaries are conceptual and do not represent measured data or physical thresholds.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <g aria-hidden="true">
    <rect x="96" y="60" width="160" height="220" fill="#eaf0ed"/>
    <rect x="256" y="60" width="160" height="220" fill="#f3eee6"/>
    <rect x="416" y="60" width="184" height="220" fill="#eef1ef"/>
    <line x1="256" y1="60" x2="256" y2="280" stroke="#c9d2cd" stroke-width="2"/>
    <line x1="416" y1="60" x2="416" y2="280" stroke="#c9d2cd" stroke-width="2"/>
    <path d="M 100 240 C 132 236, 155 213, 180 208 C 204 204, 224 225, 249 221 C 274 217, 282 195, 296 189 C 309 183, 313 142, 330 120 C 345 100, 364 107, 378 130 C 393 155, 400 186, 419 177 C 439 168, 447 140, 464 143 C 484 146, 486 170, 504 164 C 524 158, 532 126, 549 132 C 566 138, 571 160, 596 151" fill="none" stroke="#315d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="96" y1="280" x2="600" y2="280" stroke="#7c8781" stroke-width="2.5"/>
    <line x1="96" y1="280" x2="96" y2="60" stroke="#7c8781" stroke-width="2.5"/>
    <text x="176" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#315d50">A</text>
    <text x="336" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#315d50">B</text>
    <text x="508" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#315d50">C</text>
  </g>
  <text x="348" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#303a35">Energy</text>
  <text x="44" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#303a35" transform="rotate(-90 44 172)">Intensity</text>
</svg>

